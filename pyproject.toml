[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meow-push"
version = "1.0.1"
description = "Push notifications to a HarmonyOS phone through MeoW (zero dependencies)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vinlyx" }]
keywords = ["meow", "harmonyos", "notification", "push", "bark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Communications",
]

[project.urls]
Homepage = "https://github.com/vinlyx/meowMsg"

[project.scripts]
meowpush = "meow_push.cli:main"

[tool.setuptools]
packages = ["meow_push"]
