[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meow-push"
version = "0.3.0"
description = "Push notifications to a HarmonyOS phone through MeoW (zero dependencies)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Vinlyx" }]
keywords = ["meow", "harmonyos", "notification", "push", "bark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications",
]

[project.urls]
Homepage = "https://github.com/vinlyx/meowMsg"

[project.scripts]
meowpush = "meow_push.cli:main"

[tool.setuptools]
packages = ["meow_push"]
